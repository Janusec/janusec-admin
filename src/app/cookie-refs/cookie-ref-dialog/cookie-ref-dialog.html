<div class="container">
    <div>
        <button matButton mat-dialog-close class="btn-close">
            <mat-icon class="icon-close pointer">clear</mat-icon>
        </button>
    </div>
    <h2 class="dialog-title">Cookie Reference</h2>

    <div>
        <mat-form-field>
            <mat-label i18n="@@name">Name</mat-label>
            <input matInput #name [(ngModel)]="cookieRef.name" maxlength="128" required />
            <mat-hint align="end">{{name.value.length || 0}}/128</mat-hint>
        </mat-form-field>

        <mat-form-field>
            <mat-label i18n="@@cookie_operation">Operation</mat-label>
            <mat-select [(ngModel)]="cookieRef.operation" class="select-custom">
                @for (entry of cookieOperationEntries; track $index) {
                <mat-option [value]="entry[1]" class="option-custom">
                    {{ entry[0] }}
                </mat-option>
                }
            </mat-select>
        </mat-form-field>

        <mat-form-field>
            <mat-label i18n="@@vendor">Vendor</mat-label>
            <input matInput #vendor [(ngModel)]="cookieRef.vendor" maxlength="128" required />
            <mat-hint align="end">{{vendor.value.length || 0}}/128</mat-hint>
        </mat-form-field>

        <mat-form-field>
            <mat-label i18n="@@type">Type</mat-label>
            <mat-select [(ngModel)]="cookieRef.type" class="select-custom">
                @for (entry of cookieTypeEntries; track $index) {
                <mat-option [value]="entry[1]" class="option-custom">
                    {{ entry[0] }}
                </mat-option>
                }
            </mat-select>
        </mat-form-field>

        <mat-form-field>
            <mat-label i18n="@@description">Description</mat-label>
            <input matInput #description [(ngModel)]="cookieRef.description" />
        </mat-form-field>

    </div>

    <mat-dialog-actions>
        <button matButton i18n="@@save" (click)="setCookieRef()" class="btn-action pointer">Save</button>
        <button matButton mat-dialog-close i18n="@@cancel" class="btn-action pointer">Cancel</button>
    </mat-dialog-actions>
</div>
