@if (msgService.messages.length) {
<mat-list class="message-container">
    @for (message of msgService.messages; track message.id) {
    <mat-list-item class="message" class="{{message.type}}">
        <span class="message-content">{{ message.content }}</span>
        <span class="spacer"></span>
        <mat-icon (click)="removeMessage(message.id)" class="btn-clear">clear</mat-icon>
    </mat-list-item>
    }
</mat-list>
}
