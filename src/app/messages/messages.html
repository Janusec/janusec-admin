@if (msgService.messages$().length>0) {
<mat-list class="message-container">
    @for (message of msgService.messages$(); track message.id) {
    <mat-list-item class="message-list {{message.type}}">
        <span class="message-content">{{ message.content }}</span>
        <button matIconButton (click)="removeMessage(message.id)" class="btn-clear" matListItemMeta>
            <mat-icon>close</mat-icon>
        </button>
    </mat-list-item>
    }
</mat-list>
}
