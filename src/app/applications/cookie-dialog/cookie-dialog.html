<div class="container2">
    <div>
        <button matButton mat-dialog-close class="btn-close">
            <mat-icon class="icon-close pointer">clear</mat-icon>
        </button>
    </div>
    <h2 class="dialog-title">Cookie</h2>
    <div>
        <mat-form-field>
            <mat-label i18n="@@name">Name</mat-label>
            <input matInput #name [(ngModel)]="cookie.name" maxlength="128" required />
            <mat-hint align="end">{{name.value.length || 0}}/128</mat-hint>
        </mat-form-field>

        <mat-form-field>
            <mat-label i18n="@@domain">Domain</mat-label>
            <input matInput #domain [(ngModel)]="cookie.domain" maxlength="128" required />
            <mat-hint align="end">{{domain.value.length || 0}}/128</mat-hint>
        </mat-form-field>

        <mat-form-field>
            <mat-label>Path</mat-label>
            <input matInput #path [(ngModel)]="cookie.path" maxlength="128" required />
            <mat-hint align="end">{{path.value.length || 0}}/128</mat-hint>
        </mat-form-field>

        <mat-form-field>
            <mat-label i18n="@@duration">Duration</mat-label>
            <input matInput #duration [(ngModel)]="cookie.duration" maxlength="128" required />
            <mat-hint align="end">{{duration.value.length || 0}}/128</mat-hint>
        </mat-form-field>

        <mat-form-field>
            <mat-label>Vendor</mat-label>
            <input matInput #vendor [(ngModel)]="cookie.vendor" maxlength="128" required />
            <mat-hint align="end">{{vendor.value.length || 0}}/128</mat-hint>
        </mat-form-field>

        <mat-form-field>
            <mat-label i18n="@@type">Type</mat-label>
            <mat-select [(ngModel)]="cookie.type" class="select-custom">
                @for (entry of cookieTypeEntries; track entry) {
                <mat-option [value]="entry[1]" class="option-custom">
                    {{ entry[0] }}
                </mat-option>
                }
            </mat-select>
        </mat-form-field>

        <mat-form-field>
            <mat-label i18n="@@description">Description</mat-label>
            <input matInput #description [(ngModel)]="cookie.description" />
        </mat-form-field>

    </div>

    <mat-dialog-actions>
        <button matButton i18n="@@save" (click)="setCookie()" class="btn-action pointer">Save</button>
        <button matButton mat-dialog-close i18n="@@cancel" class="btn-action pointer">Cancel</button>
    </mat-dialog-actions>
</div>
