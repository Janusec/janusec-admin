<div class="container">
    <div class="header-custom">
        <h2 i18n="@@app_mgmt">Application Management</h2>
    </div>

    <div class="line-container-custom">
        <button matButton="outlined" i18n="@@add_app" (click)="openApplicationDialog(null)">Add Application</button>
        <input matInput #keyword (keyup)="applyFilter(keyword.value)" class="search-box" placeholder="Filter">
    </div>

    <div class="mat-elevation-z8">
        <mat-table #table [dataSource]="dataSource">

            <ng-container matColumnDef="name">
                <mat-header-cell i18n="@@app_name" *matHeaderCellDef> Name </mat-header-cell>
                <mat-cell *matCellDef="let element">
                    <span (click)="openApplicationDialog(element)" class="pointer">
                        {{element.name}}
                    </span>
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="description">
                <mat-header-cell i18n="@@description" *matHeaderCellDef> Description </mat-header-cell>
                <mat-cell *matCellDef="let element"> {{element.description}} </mat-cell>
            </ng-container>

            <ng-container matColumnDef="waf_enabled">
                <mat-header-cell i18n="@@waf_enabled2" *matHeaderCellDef class="center_column"> WAF Enabled
                </mat-header-cell>
                <mat-cell *matCellDef="let element" class="center_column">
                    @if (element.waf_enabled) {
                    <mat-icon class="icon-green">security</mat-icon>
                    } @else {
                    <mat-icon class="icon-red">security</mat-icon>
                    }
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="action">
                <mat-header-cell *matHeaderCellDef> Action </mat-header-cell>
                <mat-cell *matCellDef="let element">
                    <mat-icon (click)="openApplicationDialog(element)" class="pointer">
                        edit
                    </mat-icon>
                    <span>&nbsp;</span>
                    <mat-icon (click)="delApplication(element)" class="pointer">
                        delete
                    </mat-icon>
                </mat-cell>
            </ng-container>

            <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
            <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>
        <mat-paginator #paginator [pageSize]="10" [pageSizeOptions]="[10, 20, 50]">
        </mat-paginator>
    </div>

</div>
