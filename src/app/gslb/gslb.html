<div class="container">
    <div class="header-custom">
        <h2 i18n="@@gslb_domain_name_mgmt">GSLB Domain Name Management</h2>
    </div>
    <div class="line-container-custom">
        @if (rpcService.authUser$().is_super_admin) {
        <button matButton="outlined" i18n="@@add_domain_name" class="btn-add pointer"
            (click)="openDNSDomainDialog(null)">
            Add Domain Name</button>
        }
        <input matInput #keyword (keyup)="applyFilter(keyword.value)" class="search-box" placeholder="Filter" />
    </div>

    <div class="mat-elevation-z8">
        <mat-table #table [dataSource]="dataSource">

            <ng-container matColumnDef="name">
                <mat-header-cell i18n="@@name" *matHeaderCellDef> Name </mat-header-cell>
                <mat-cell *matCellDef="let element">
                    <span>{{element.name}}</span>
                </mat-cell>
            </ng-container>

            <ng-container matColumnDef="action">
                <mat-header-cell *matHeaderCellDef i18n="@@action"> Action </mat-header-cell>
                <mat-cell *matCellDef="let element">
                    <button matButton i18n="@@dns_record" (click)="openDNSRecordsDialog(element)">DNS Record</button>
                    <span>&nbsp;&nbsp;&nbsp;&nbsp;</span>
                    <span>
                        <button matButton (click)="deleteDNSDomain(element)" i18n="@@delete">
                            Delete
                        </button>
                    </span>
                </mat-cell>
            </ng-container>

            <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
            <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>
        <mat-paginator #paginator [pageSize]="20" [pageSizeOptions]="[10, 20, 50]">
        </mat-paginator>
    </div>

</div>
