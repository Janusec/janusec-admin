<div class="container">
    <div>
        <button matButton mat-dialog-close class="btn-close">
            <mat-icon class="icon-close pointer">clear</mat-icon>
        </button>
    </div>
    <h2 i18n="@@domain_name" class="dialog-title">Domain Name</h2>

    <div>

        <mat-form-field>
            <mat-label i18n="@@name">Name</mat-label>
            <input matInput #name [(ngModel)]="dnsDomain.name" maxlength="128" placeholder="example.com" required />
            <mat-hint align="end">{{name.value.length || 0}}/128</mat-hint>
        </mat-form-field>

    </div>

    <mat-dialog-actions>
        <button matButton i18n="@@save" (click)="setDNSDomain()" class="btn-action pointer">Save</button>
        <button matButton mat-dialog-close class="btn-action pointer">Close</button>
    </mat-dialog-actions>
</div>
