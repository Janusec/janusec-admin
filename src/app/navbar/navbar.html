<mat-toolbar color="secondary">
    <span>
        <a routerLink="/" class="text-logo">JANUSEC</a>
    </span>
    <span class="spacer"></span>

    @if (rpcService.authUser$().logged) {
    <button matButton [matMenuTriggerFor]="menu" class="btn-with-icon nav-menu-custom">
        <mat-icon color="secondary">account_circle</mat-icon>
        <span>
            {{rpcService.authUser$().username}}
        </span>
    </button>

    <mat-menu #menu="matMenu" [overlapTrigger]="false">
        <button mat-menu-item (click)="openAppUserDialog(rpcService.curAppUser$())"
            class="btn-with-icon nav-menu-custom">
            <mat-icon>account_circle</mat-icon>
            <span i18n="@@lang">My Information</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="switchLanguage()" class="btn-with-icon nav-menu-custom">
            <mat-icon>language</mat-icon>
            <span i18n="@@lang">中文</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout()" class="btn-with-icon nav-menu-custom">
            <mat-icon>logout</mat-icon>
            Logout
        </button>
    </mat-menu>
    }
    @if (rpcService.authUser$().logged===false) {
    <button matButton i18n="@@login" (click)="navigate('/login')" class="btn-with-icon nav-menu-custom">
        Login
    </button>
    }


</mat-toolbar>
